name: "Automated Nightly Infrastructure Drift Detection"

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC Daily
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  detect-drift:
    name: "Drift Check - ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prod]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG || 'rg-enterprise-tfstate' }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT || 'stenterprisetfstate' }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ matrix.environment }}.terraform.tfstate"

      - name: Detect Infrastructure Drift
        id: drift
        run: |
          set +e
          TFVARS="environments/${{ matrix.environment }}/terraform.tfvars"
          terraform plan -detailed-exitcode -no-color -var-file="$TFVARS" -out=drift.tfplan > drift_output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ No infrastructure drift detected in ${{ matrix.environment }}."
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "⚠️ DRIFT DETECTED in ${{ matrix.environment }}!"
          else
            echo "❌ Terraform plan failed with error code $EXIT_CODE."
            exit $EXIT_CODE
          fi

      - name: Create GitHub Issue on Detected Drift
        if: steps.drift.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diffContent = "Drift detected during automated plan.";
            try {
              diffContent = fs.readFileSync('drift_output.txt', 'utf8').slice(0, 5000);
            } catch (err) {
              diffContent = String(err);
            }
            
            const issueTitle = `🚨 Infrastructure Drift Detected in [${{ matrix.environment }}]`;
            const issueBody = `### Automated Drift Alert
            
            Infrastructure drift was detected between live Azure resources and version-controlled Terraform state in the **${{ matrix.environment }}** environment.
            
            #### Plan Difference Summary:
            \`\`\`hcl
            ${diffContent}
            \`\`\`
            
            #### Recommended Remediation Steps:
            1. Review changes against authorized change orders.
            2. Run \`./scripts/reconcile-drift.sh --env ${{ matrix.environment }}\` to synchronize state or revert unauthorized changes.
            3. Apply desired state via deployment pipeline.
            
            *Triggered automatically by Nightly Drift Detection Pipeline.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['drift-alert', 'security', 'automated']
            });
